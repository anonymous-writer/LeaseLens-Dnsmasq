name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update release pull request
        uses: googleapis/release-please-action@v5
        with:
          # Use a PAT or GitHub App token so the resulting tag/release can trigger build workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple
