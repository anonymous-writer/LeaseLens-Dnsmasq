name: Build dnsmasq-leases-ui native binaries

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test Go application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

  build-native:
    name: Build Linux ${{ matrix.arch }} native binary
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build standalone Linux binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.nativeBuild=true" \
            -o "dist/dnsmasq-leases-ui-linux-${GOARCH}" .

      - name: Package binary (preserve executable permissions)
        run: |
          tar -czf "dist/dnsmasq-leases-ui-linux-${{ matrix.arch }}.tar.gz" \
            -C dist "dnsmasq-leases-ui-linux-${{ matrix.arch }}"

      - name: Upload standalone binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsmasq-leases-ui-linux-${{ matrix.arch }}
          path: dist/dnsmasq-leases-ui-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release-assets:
    name: Attach native binaries to GitHub Release
    if: github.event_name == 'release'
    needs: build-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download ARM64 and AMD64 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dnsmasq-leases-ui-linux-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum dnsmasq-leases-ui-linux-*.tar.gz > SHA256SUMS

      - name: Attach archives and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/dnsmasq-leases-ui-linux-arm64.tar.gz \
            dist/dnsmasq-leases-ui-linux-amd64.tar.gz \
            dist/SHA256SUMS \
            --clobber
