name: Build dnsmasq-leases-ui ARM64 binary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Test and build standalone Linux ARM64 binary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build standalone Linux ARM64 binary
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.nativeBuild=true" -o dist/dnsmasq-leases-ui-linux-arm64 .

      - name: Package binary (preserve executable permissions)
        run: tar -czf dist/dnsmasq-leases-ui-linux-arm64.tar.gz -C dist dnsmasq-leases-ui-linux-arm64

      - name: Upload standalone binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: dnsmasq-leases-ui-linux-arm64
          path: dist/dnsmasq-leases-ui-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
