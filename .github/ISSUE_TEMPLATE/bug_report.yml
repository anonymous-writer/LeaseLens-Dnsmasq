name: "Bug report"
description: "Report a problem with dnsmasq-leases-ui"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please search existing issues first and avoid posting passwords, public IPs, MAC addresses, or other sensitive network details.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked that a similar issue has not already been reported.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: What did you see? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the steps needed to reproduce the problem.
      placeholder: |
        1. Start dnsmasq-leases-ui...
        2. Open...
        3. Click...
        4. See error...
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - Native Linux binary
        - Docker
        - Podman / Compose
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dnsmasq-leases-ui version
      description: Version shown in the page footer or release tag.
      placeholder: "v2.1.1-Beta.2"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: "Raspberry Pi OS 64-bit, ARM64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove sensitive network details before posting. Include relevant errors if available.
      render: text
    validations:
      required: false
