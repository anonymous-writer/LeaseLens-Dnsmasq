# OpenResty required. Include this in the relevant server/location context.
# Reads the app's atomically replaced JSON token file on EVERY request.
set_by_lua_block $leaselens_proxy_token {
    local file, err = io.open("/etc/nginx/secrets/leaselens-proxy-token.json", "r")
    if not file then
        ngx.log(ngx.ERR, "cannot read LeaseLens proxy token file: ", err)
        return ""
    end
    local raw = file:read("*a")
    file:close()
    local cjson = require "cjson.safe"
    local state = cjson.decode(raw)
    if type(state) ~= "table" or type(state.current) ~= "string" or #state.current ~= 100 then
        ngx.log(ngx.ERR, "invalid LeaseLens proxy token state")
        return ""
    end
    return state.current
}

# Inside the proxied location:
proxy_set_header X-LeaseLens-Proxy-Token  $leaselens_proxy_token;
