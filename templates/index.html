<!doctype html>
<html lang="en">
<head>
  <!-- Dokument-Metadaten: UTF-8, mobile Darstellung und Theme-Unterstützung. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>dnsmasq-leases-ui</title>
  <!-- Das Icon wird statisch vom Webserver aus /static ausgeliefert. -->
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <style>
:root {
  --bg:#fff;
  --fg:#111;
  --row:#e6e6e6;
  --muted:#666;
  --border:#ccc;
  --accent:#06c
}
/* Wenn kein Theme explizit gewählt wurde, Systemeinstellung für Dunkelmodus nutzen. */
@media(prefers-color-scheme:dark) {
  :root:not([data-theme=light]) {
    --bg:#1a1a1a;
    --fg:#e6e6e6;
    --row:#2a2a2a;
    --muted:#999;
    --border:#444;
    --accent:#4d9fff
  }
}
/* Explizit aktiviertes dunkles Theme. Die Werte entsprechen dem Dark-Mode-Teil oben. */
:root[data-theme=dark] {
  --bg:#1a1a1a;
  --fg:#e6e6e6;
  --row:#2a2a2a;
  --muted:#999;
  --border:#444;
  --accent:#4d9fff
}
/* Grundlayout der gesamten Seite. */
body {
  font-family:system-ui,sans-serif;
  background:var(--bg);
  color:var(--fg);
  margin:1rem
}
/* Werkzeugleiste mit Suche, Filtern und Aktionsbuttons. */
#toolbar {
  position:sticky;
  top:0;
  background:var(--bg);
  padding:.5rem 0;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.5rem;
  z-index:2
}
/* Suchfeld: max-width begrenzt die Breite auf großen Bildschirmen. */
#search {
  max-width:24rem;
  flex:1;
  padding:.4rem .6rem;
  font:inherit;
  color:var(--fg);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px
}
/* Dropdowns für IP-Version und DHCP-Reservierungsfilter. */
#ip-filter,#reservation-filter,#status-filter,#language-select {
  padding:.4rem .5rem;
  font:inherit;
  color:var(--fg);
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:4px;
  max-width:100%
}
/* Buttons zum Zurücksetzen und zum Merken reservierter Geräte. */
#reset-known-button,#mark-reservations-button,#mark-all-ipv4-reservations-button {
  padding:.4rem .7rem;
  font:inherit;
  background:var(--bg);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:4px;
  cursor:pointer
}
#reset-known-button:disabled,#mark-reservations-button:disabled,#mark-all-ipv4-reservations-button:disabled {
  opacity:.6;
  cursor:wait
}
/* Markanter roter Button zum manuellen Aktualisieren der Lease-Liste. */
#refresh-button {
  padding:.4rem .8rem;
  font:inherit;
  font-weight:650;
  background:#dc2626;
  color:#fff;
  border:1px solid #b91c1c;
  border-radius:5px;
  cursor:pointer;
  box-shadow:0 1px 2px #0002;
  transition:background-color .15s ease, box-shadow .15s ease, transform .15s ease
}
#refresh-button:hover:not(:disabled) {
  background:#b91c1c;
  box-shadow:0 2px 5px #0003
}
#refresh-button:active:not(:disabled) {
  background:#991b1b;
  transform:translateY(1px)
}
#refresh-button:focus-visible {
  outline:3px solid #fca5a5;
  outline-offset:2px
}
#refresh-button:disabled {
  background:#991b1b;
  border-color:#7f1d1d;
  opacity:.75;
  cursor:wait
}
/* Runder Umschalter für helles/dunkles Theme. */
#theme-toggle {
  margin-left:auto;
  border:1px solid var(--fg);
  background:var(--bg);
  color:var(--fg);
  border-radius:50%;
  width:2.25rem;
  height:2.25rem;
  cursor:pointer
}
.icon-sun {
  display:none
}
:root[data-theme=dark] .icon-moon {
  display:none
}
:root[data-theme=dark] .icon-sun {
  display:inline
}
/* Tabelle und Spaltenüberschriften. */
table {
  border-collapse:collapse;
  width:100%
}
th,td {
  text-align:left;
  padding:.5rem;
  border-bottom:1px solid var(--border)
}
th {
  position:sticky;
  top:3.2rem;
  background:var(--bg);
  cursor:pointer
}
tbody tr:hover {
  background:var(--row)
}
a {
  color:var(--accent)
}
/* Statuszeile unter der Tabelle; bei Fehlern kommt zusätzlich .error dazu. */
#status {
  margin-top:.75rem;
  color:var(--muted)
}
#status.error {
  color:#c00
}
/* Zeigt letzte erfolgreiche Aktualisierung sowie Lade- oder Fehlerzustand separat. */
#refresh-meta {
  display:flex;
  flex-wrap:wrap;
  gap:.35rem 1rem;
  margin-top:.25rem;
  color:var(--muted);
  font-size:.85rem
}
#refresh-state.error {
  color:#c00
}
.refresh-icon {
  display:inline-block
}
#refresh-button[aria-busy="true"] .refresh-icon {
  animation:refresh-spin .9s linear infinite
}
@keyframes refresh-spin {
  to { transform:rotate(360deg) }
}
/* Bei schmalen Fenstern kann die Werkzeugleiste umbrechen; dann darf sie die Tabelle nicht überdecken. */
@media (max-width: 900px) {
  #toolbar { position:static; }
  th { top:0; }
}
/* Versions-/Release-Information am Seitenende. */
footer {
  margin-top:1rem;
  color:var(--muted);
  font-size:.9rem
}
/* Tabellenzeilen, die durch app.js anklickbar gemacht werden. */
tr.device-row {
  cursor:pointer
}
tr.new-device {
  background:#fff0cc
}
:root[data-theme=dark] tr.new-device {
  background:#493b20
}
/* Kennzeichnung für neue Geräte. */
.new-badge {
  display:inline-block;
  background:#b45309;
  color:#fff;
  font-size:.7rem;
  font-weight:700;
  padding:.12rem .35rem;
  border-radius:4px;
  letter-spacing:.03em
}
/* Statusspalte und farbige Statuspunkte. */
.device-status {
  white-space:nowrap;
  font-weight:600
}
.dot {
  display:inline-block;
  width:.55rem;
  height:.55rem;
  border-radius:50%;
  margin-right:.35rem;
  background:#888
}
.dot.online {
  background:#159447
}
.dot.reachable {
  background:#d9a400
}
.dot.offline {
  background:#c33
}
.dot.unknown {
  background:#888
}
/* Modal für die Gerätedetails. */
dialog {
  max-width:min(38rem,calc(100vw - 3rem));
  width:100%;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--bg);
  color:var(--fg)
}
dialog::backdrop {
  background:#0008
}
/* Responsive Anordnung der Informationen im Detaildialog. */
.detail-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));
  gap:.8rem
}
.detail-item {
  padding:.65rem;
  border:1px solid var(--border);
  border-radius:6px;
  overflow-wrap:anywhere
}
/* Kopierbuttons innerhalb der Gerätedetails. */
.copy-button {
  display:block;
  margin-top:.45rem;
  padding:.2rem .45rem;
  font:inherit;
  font-size:.8rem;
  background:var(--bg);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:4px;
  cursor:pointer
}
.detail-label {
  display:block;
  color:var(--muted);
  font-size:.8rem;
  margin-bottom:.2rem
}
#copy-device-details-button {
  display:inline-block;
  margin:.25rem 0 .75rem;
}
#detail-close {
  float:right;
  padding:.4rem .7rem;
  background:var(--bg);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:5px;
  cursor:pointer
}
  </style></head><body>
  <!--
    Hauptwerkzeugleiste.
    Wichtig: IDs werden von /static/app.js verwendet. Beim Umbenennen einer ID
    muss deshalb auch die Referenz in app.js angepasst werden.
  -->
  <div id="toolbar">
    <!-- Freitextsuche über geladene DHCP-Leases. -->
    <input id="search" type="search" placeholder="Filter leases…" data-i18n-placeholder="searchPlaceholder"
           aria-label="Filter leases" data-i18n-aria-label="searchPlaceholder" autocomplete="off">

    <!-- Einschränkung auf IPv4, IPv6 oder alle IP-Versionen. -->
    <select id="ip-filter" aria-label="Filter IPv4/IPv6" data-i18n-aria-label="ipFilterTitle" title="Filter IPv4/IPv6" data-i18n-title="ipFilterTitle">
      <option value="all" data-i18n="allIPs">All IPs</option>
      <option value="ipv4" data-i18n="ipv4">IPv4</option>
      <option value="ipv6" data-i18n="ipv6">IPv6</option>
    </select>

    <!-- Filtert die Ansicht nach DHCP-Reservierungen oder dynamischen Leases. -->
    <select id="reservation-filter" aria-label="Filter DHCP reservations" data-i18n-aria-label="reservationFilterTitle" title="Filter DHCP reservations" data-i18n-title="reservationFilterTitle">
      <option value="all" data-i18n="allLeases">All leases</option>
      <option value="reserved" data-i18n="reservations">Reservations</option>
      <option value="dynamic" data-i18n="dynamicOnly">Dynamic only</option>
    </select>

    <!-- Filtert nach dem Ergebnis der letzten Statusprüfung. -->
    <select id="status-filter" aria-label="Filter by device status" data-i18n-aria-label="statusFilterTitle" title="Filter by device status" data-i18n-title="statusFilterTitle">
      <option value="all" data-i18n="allStatuses">All statuses</option>
      <option value="online" data-i18n="webOnlineFilter">HTTP/HTTPS responds</option>
      <option value="reachable" data-i18n="pingOnlyFilter">Ping responds, no web UI</option>
      <option value="offline" data-i18n="noResponseFilter">No ping or web response</option>
    </select>

    <!-- Refresh wird in app.js verdrahtet; es ist kein automatischer Polling-Timer. -->
    <button id="refresh-button" type="button" title="Refresh" data-i18n-title="refresh" aria-label="Refresh" data-i18n-aria-label="refresh"><span class="refresh-icon" aria-hidden="true">↻</span> <span data-i18n="refresh">Refresh</span></button>

    <!-- Merkt alle aktuell erkannten DHCP-Reservierungen mit gültiger MAC-Adresse. -->
    <button id="mark-reservations-button" type="button" title="Mark currently detected DHCP reservations as known" data-i18n-title="markReservationsKnownTitle"><span data-i18n="markReservationsKnown">Mark reservations known</span></button>

    <!-- Merkt alle IPv4-Reservierungen direkt aus der konfigurierten DHCP-Hosts-Datei, auch offline. -->
    <button id="mark-all-ipv4-reservations-button" type="button" title="Mark all configured IPv4 reservations as known, including offline devices" data-i18n-title="markAllIPv4ReservationsTitle"><span data-i18n="markAllIPv4Reservations">Mark all IPv4 reservations</span></button>

    <!-- Entfernt nach Bestätigung alle dauerhaft gespeicherten Merkeinträge. -->
    <button id="reset-known-button" type="button" title="Forget all remembered devices" data-i18n-title="resetRememberedTitle"><span data-i18n="resetRemembered">Reset remembered</span></button>

    <!-- Sprachauswahl: die zentralen Übersetzungen liegen in static/translations.js. -->
    <select id="language-select" aria-label="Language" data-i18n-aria-label="language" title="Select language" data-i18n-title="selectLanguage">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>

    <!-- Theme-Umschalter: app.js setzt das Theme; CSS zeigt jeweils das passende Symbol. -->
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" data-i18n-aria-label="toggleTheme" title="Toggle dark mode" data-i18n-title="toggleTheme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </div>

  <!--
    Lease-Tabelle. app.js fügt die Zeilen zur Laufzeit in tbody ein und behandelt
    Sortierung/Klicks. data-key muss zu den Feldnamen in der API passen.
  -->
  <table id="leases">
    <thead>
      <tr>
        <th data-key="status"><span data-i18n="status">Status</span><span class="sort-indicator"></span></th>
        <th data-key="ipAddress"><span data-i18n="ipAddress">IP Address</span><span class="sort-indicator"></span></th>
        <th data-key="macAddress"><span data-i18n="macAddress">MAC Address</span><span class="sort-indicator"></span></th>
        <th data-key="name"><span data-i18n="name">Name</span><span class="sort-indicator"></span></th>
        <th data-key="staticIP"><span data-i18n="dhcpReservation">DHCP Reservation</span><span class="sort-indicator"></span></th>
        <th data-key="leasetime"><span data-i18n="leaseEndsOn">Lease ends on</span><span class="sort-indicator"></span></th>
      </tr>
    </thead>
    <!-- Bleibt leer, bis app.js Lease-Daten von /leases geladen hat. -->
    <tbody></tbody>
  </table>

  <!-- Tabellenzusammenfassung sowie letzter Erfolg und aktueller Lade-/Fehlerstatus. -->
  <div id="status" role="status" aria-live="polite" data-i18n="loading">Loading…</div>
  <div id="refresh-meta" aria-live="polite">
    <span id="last-updated"></span>
    <span id="refresh-state"></span>
  </div>

  <!-- Modal: app.js befüllt #detail-content mit den gewählten Gerätedetails. -->
  <dialog id="device-details" aria-labelledby="detail-title">
    <button id="detail-close" type="button" data-i18n="close">Close</button>
    <h2 id="detail-title" data-i18n="deviceDetails">Device details</h2>
    <button id="copy-device-details-button" class="copy-button" type="button" data-i18n="copyDeviceDetails">Copy device details</button>
    <div id="detail-content" class="detail-grid"></div>
  </dialog>

  <!--
    Go-Template-Variablen: .RepoURL, .Version und .ReleaseDate werden serverseitig
    eingesetzt. Diese Platzhalter nicht entfernen, wenn die Datei als Go-Template
    verwendet wird.
  -->
  <footer>
    <a href="{{.RepoURL}}" target="_blank" rel="noopener noreferrer">dnsmasq-leases-ui</a>
    v{{.Version}}{{if .ReleaseDate}} · <span data-i18n="released">released</span> {{.ReleaseDate}}{{end}}
  </footer>

  <!-- Cache-Busting: Versionswert ändert die URL, wenn ein neues App-Build geladen wird. -->
  <script src="/static/translations.js?v={{.Version}}"></script>
  <script src="/static/app.js?v={{.Version}}"></script>
</body>
</html>
