<!doctype html>
<html lang="en">
<head>
  <!-- Dokument-Metadaten: UTF-8, mobile Darstellung und Theme-Unterstützung. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>dnsmasq-leases-ui</title>
  <!-- Das Icon wird statisch vom Webserver aus /static ausgeliefert. -->
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <style>
 :root {
  color-scheme: light dark;
  --bg:#101216; --surface:#181b21; --surface-raised:#20242c; --fg:#e8ebf0;
  --muted:#9ba4b2; --border:#303641; --accent:#69aaff;
  --green:#43c982; --yellow:#f0bf4c; --red:#ff6868;
  --shadow:0 8px 28px #0003;
}
:root[data-theme=light] { color-scheme:light; --bg:#f4f6f9; --surface:#fff; --surface-raised:#f7f9fc; --fg:#202633; --muted:#687386; --border:#dfe4ec; --accent:#075fbd; --shadow:0 8px 28px #18243a0d; }
@media(prefers-color-scheme:light) { :root:not([data-theme=dark]) { color-scheme:light; --bg:#f4f6f9; --surface:#fff; --surface-raised:#f7f9fc; --fg:#202633; --muted:#687386; --border:#dfe4ec; --accent:#075fbd; --shadow:0 8px 28px #18243a0d; } }
* { box-sizing:border-box; }
body { margin:0; padding:1.25rem clamp(.75rem,2vw,2rem) 2rem; font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
#toolbar { position:sticky; top:0; z-index:5; display:grid; grid-template-columns:minmax(14rem,1.5fr) repeat(3,minmax(8rem,.75fr)) auto; align-items:center; gap:.55rem; padding:.75rem 0; background:var(--bg); }
#search,#ip-filter,#reservation-filter,#status-filter,#language-select,#toolbar button { min-height:2.45rem; padding:.55rem .75rem; font:inherit; color:var(--fg); background:var(--surface); border:1px solid var(--border); border-radius:8px; }
#search { min-width:0; width:100%; }
#search:focus,#toolbar select:focus-visible,#toolbar button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
#toolbar button { cursor:pointer; white-space:nowrap; transition:background .15s,border-color .15s; }
#toolbar button:hover:not(:disabled) { background:var(--surface-raised); border-color:var(--muted); }
#refresh-button { background:#b4232d!important; border-color:#b4232d!important; color:#fff!important; font-weight:650!important; }
#refresh-button:hover:not(:disabled) { background:#941d26!important; }
#reset-known-button:disabled,#mark-reservations-button:disabled,#mark-all-ipv4-reservations-button:disabled { opacity:.6; cursor:wait; }
#theme-toggle { justify-self:end; width:2.45rem; padding:.4rem!important; display:grid; place-items:center; }
.icon-sun { display:none; } :root[data-theme=dark] .icon-moon { display:none; } :root[data-theme=dark] .icon-sun { display:inline; }
#summary-cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.8rem; margin:.65rem 0 1rem; }
.summary-card { min-width:0; padding:1rem 1.1rem; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
.summary-label { display:block; color:var(--muted); font-size:.82rem; margin-bottom:.3rem; }
.summary-value { display:flex; align-items:center; gap:.55rem; font-size:1.65rem; font-weight:750; letter-spacing:-.035em; line-height:1.2; }
.summary-dot { width:.6rem; height:.6rem; border-radius:50%; background:var(--muted); }
.summary-card.online .summary-dot { background:var(--green); } .summary-card.reachable .summary-dot { background:var(--yellow); } .summary-card.offline .summary-dot { background:var(--red); }
.table-wrap { overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); }
table { border-collapse:separate; border-spacing:0; width:100%; min-width:760px; }
th,td { text-align:left; padding:.78rem .9rem; border-bottom:1px solid var(--border); }
th { position:sticky; top:0; z-index:1; background:var(--surface-raised); color:var(--muted); font-size:.76rem; font-weight:700; text-transform:uppercase; letter-spacing:.045em; white-space:nowrap; cursor:pointer; }
tbody tr:last-child td { border-bottom:0; } tbody tr:hover { background:var(--surface-raised); } tr.device-row { cursor:pointer; transition:background .12s; } tr.device-row:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
#status { margin-top:.85rem; color:var(--muted); font-size:.85rem; } #status.error,#refresh-state.error { color:var(--red); }
#refresh-meta { display:flex; flex-wrap:wrap; gap:.35rem 1rem; margin-top:.3rem; color:var(--muted); font-size:.8rem; }
.refresh-icon { display:inline-block; } #refresh-button[aria-busy="true"] .refresh-icon { animation:refresh-spin .9s linear infinite; } @keyframes refresh-spin { to { transform:rotate(360deg); } }
tr.new-device { background:color-mix(in srgb,var(--yellow) 9%,var(--surface)); } .new-badge { display:inline-block; background:#b45309; color:#fff; font-size:.68rem; font-weight:750; padding:.12rem .35rem; border-radius:5px; letter-spacing:.03em; }
.device-status { white-space:nowrap; font-weight:600; font-size:.82rem; }
.dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; margin-right:.45rem; background:#858b96; vertical-align:middle; }
.dot.online { background:var(--green); box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 14%,transparent); } .dot.reachable { background:var(--yellow); box-shadow:0 0 0 3px color-mix(in srgb,var(--yellow) 14%,transparent); } .dot.offline { background:var(--red); box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 14%,transparent); } .dot.unknown { background:#858b96; }
#device-details { max-width:min(43rem,calc(100vw - 2rem)); width:100%; padding:1.35rem; border:1px solid var(--border); border-radius:14px; background:var(--surface); color:var(--fg); box-shadow:var(--shadow); }
#device-details::backdrop { background:#07090dcc; backdrop-filter:blur(3px); }
#detail-title { margin:.1rem 0 1rem; font-size:1.3rem; letter-spacing:-.02em; } .detail-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.65rem; }
.detail-item { padding:.8rem; background:var(--surface-raised); border:1px solid var(--border); border-radius:9px; overflow-wrap:anywhere; }
.detail-label { display:block; color:var(--muted); font-size:.76rem; margin-bottom:.3rem; } .copy-button,#detail-close { padding:.35rem .6rem; font:inherit; font-size:.8rem; background:var(--surface); color:var(--fg); border:1px solid var(--border); border-radius:6px; cursor:pointer; }
.copy-button { display:block; margin-top:.5rem; } #copy-device-details-button { margin:.1rem 0 1rem; } #detail-close { float:right; }
footer { margin-top:1.2rem; color:var(--muted); font-size:.8rem; }
@media(max-width:1000px) { #toolbar { position:static; grid-template-columns:repeat(2,minmax(0,1fr)); } #search { grid-column:1/-1; } #theme-toggle { margin-left:0; justify-self:start; } }
@media(max-width:620px) { body { padding:.7rem; } #toolbar { grid-template-columns:1fr 1fr; gap:.45rem; } #toolbar button,#toolbar select { width:100%; white-space:normal; } #summary-cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:.55rem; } .summary-card { padding:.8rem; } .summary-value { font-size:1.4rem; } .detail-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }
</style></head><body data-lease-release-enabled="{{if .EnableLeaseRelease}}true{{else}}false{{end}}">
  <!--
    Hauptwerkzeugleiste.
    Wichtig: IDs werden von /static/app.js verwendet. Beim Umbenennen einer ID
    muss deshalb auch die Referenz in app.js angepasst werden.
  -->
  <div id="toolbar">
    <!-- Freitextsuche über geladene DHCP-Leases. -->
    <input id="search" type="search" placeholder="Filter leases…" data-i18n-placeholder="searchPlaceholder"
           aria-label="Filter leases" data-i18n-aria-label="searchPlaceholder" autocomplete="off">

    <!-- Einschränkung auf IPv4, IPv6 oder alle IP-Versionen. -->
    <select id="ip-filter" aria-label="Filter IPv4/IPv6" data-i18n-aria-label="ipFilterTitle" title="Filter IPv4/IPv6" data-i18n-title="ipFilterTitle">
      <option value="all" data-i18n="allIPs">All IPs</option>
      <option value="ipv4" data-i18n="ipv4">IPv4</option>
      <option value="ipv6" data-i18n="ipv6">IPv6</option>
    </select>

    <!-- Filtert die Ansicht nach DHCP-Reservierungen oder dynamischen Leases. -->
    <select id="reservation-filter" aria-label="Filter DHCP reservations" data-i18n-aria-label="reservationFilterTitle" title="Filter DHCP reservations" data-i18n-title="reservationFilterTitle">
      <option value="all" data-i18n="allLeases">All leases</option>
      <option value="reserved" data-i18n="reservations">Reservations</option>
      <option value="dynamic" data-i18n="dynamicOnly">Dynamic only</option>
    </select>

    <!-- Filtert nach dem Ergebnis der letzten Statusprüfung. -->
    <select id="status-filter" aria-label="Filter by device status" data-i18n-aria-label="statusFilterTitle" title="Filter by device status" data-i18n-title="statusFilterTitle">
      <option value="all" data-i18n="allStatuses">All statuses</option>
      <option value="online" data-i18n="webOnlineFilter">HTTP/HTTPS responds</option>
      <option value="reachable" data-i18n="pingOnlyFilter">Ping responds, no web UI</option>
      <option value="offline" data-i18n="noResponseFilter">No ping or web response</option>
    </select>

    <!-- Refresh wird in app.js verdrahtet; es ist kein automatischer Polling-Timer. -->
    <button id="refresh-button" type="button" title="Refresh" data-i18n-title="refresh" aria-label="Refresh" data-i18n-aria-label="refresh"><span class="refresh-icon" aria-hidden="true">↻</span> <span data-i18n="refresh">Refresh</span></button>

    <!-- Merkt alle aktuell erkannten DHCP-Reservierungen mit gültiger MAC-Adresse. -->
    <button id="mark-reservations-button" type="button" title="Mark currently detected DHCP reservations as known" data-i18n-title="markReservationsKnownTitle"><span data-i18n="markReservationsKnown">Mark reservations known</span></button>

    <!-- Liest die DHCP-Hosts-Datei direkt und merkt auch offline IPv4-Reservierungen. -->
    <button id="mark-all-ipv4-reservations-button" type="button" title="Mark all configured IPv4 reservations as known" data-i18n-title="markAllIPv4ReservationsTitle"><span data-i18n="markAllIPv4Reservations">Mark all IPv4 reservations</span></button>

    <!-- Entfernt nach Bestätigung alle dauerhaft gespeicherten Merkeinträge. -->
    <button id="reset-known-button" type="button" title="Forget all remembered devices" data-i18n-title="resetRememberedTitle"><span data-i18n="resetRemembered">Reset remembered</span></button>

    <!-- Sprachauswahl: die zentralen Übersetzungen liegen in static/translations.js. -->
    <select id="language-select" aria-label="Language" data-i18n-aria-label="language" title="Select language" data-i18n-title="selectLanguage">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
    </select>

    <!-- Theme-Umschalter: app.js setzt das Theme; CSS zeigt jeweils das passende Symbol. -->
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode" data-i18n-aria-label="toggleTheme" title="Toggle dark mode" data-i18n-title="toggleTheme">
      <svg class="icon-moon" viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </button>
  </div>

  <section id="summary-cards" aria-label="Lease summary">
    <div class="summary-card"><span class="summary-label" data-i18n="summaryTotal">Total leases</span><div class="summary-value"><span id="summary-total">—</span></div></div>
    <div class="summary-card online"><span class="summary-label" data-i18n="summaryOnline">Online</span><div class="summary-value"><span class="summary-dot" aria-hidden="true"></span><span id="summary-online">—</span></div></div>
    <div class="summary-card reachable"><span class="summary-label" data-i18n="summaryExpiring">Expires within 24 hours</span><div class="summary-value"><span class="summary-dot" aria-hidden="true"></span><span id="summary-expiring">—</span></div></div>
    <div class="summary-card offline"><span class="summary-label" data-i18n="summaryOffline">Offline</span><div class="summary-value"><span class="summary-dot" aria-hidden="true"></span><span id="summary-offline">—</span></div></div>
  </section>

  <!--
    Lease-Tabelle. app.js fügt die Zeilen zur Laufzeit in tbody ein und behandelt
    Sortierung/Klicks. data-key muss zu den Feldnamen in der API passen.
  -->
  <div class="table-wrap">
  <table id="leases">
    <thead>
      <tr>
        <th data-key="status"><span data-i18n="status">Status</span><span class="sort-indicator"></span></th>
        <th data-key="ipAddress"><span data-i18n="ipAddress">IP Address</span><span class="sort-indicator"></span></th>
        <th data-key="macAddress"><span data-i18n="macAddress">MAC Address</span><span class="sort-indicator"></span></th>
        <th data-key="name"><span data-i18n="name">Name</span><span class="sort-indicator"></span></th>
        <th data-key="staticIP"><span data-i18n="dhcpReservation">DHCP Reservation</span><span class="sort-indicator"></span></th>
        <th data-key="leasetime"><span data-i18n="leaseEndsOn">Lease ends on</span><span class="sort-indicator"></span></th>
      </tr>
    </thead>
    <!-- Bleibt leer, bis app.js Lease-Daten von /leases geladen hat. -->
    <tbody></tbody>
  </table>
  </div>

  <!-- Tabellenzusammenfassung sowie letzter Erfolg und aktueller Lade-/Fehlerstatus. -->
  <div id="status" role="status" aria-live="polite" data-i18n="loading">Loading…</div>
  <div id="refresh-meta" aria-live="polite">
    <span id="last-updated"></span>
    <span id="refresh-state"></span>
  </div>

  <!-- Modal: app.js befüllt #detail-content mit den gewählten Gerätedetails. -->
  <dialog id="device-details" aria-labelledby="detail-title">
    <button id="detail-close" type="button" data-i18n="close">Close</button>
    <h2 id="detail-title" data-i18n="deviceDetails">Device details</h2>
    <button id="copy-device-details-button" class="copy-button" type="button" data-i18n="copyDeviceDetails">Copy device details</button>
    <div id="detail-content" class="detail-grid"></div>
  </dialog>

  <!--
    Go-Template-Variablen: .RepoURL, .Version und .ReleaseDate werden serverseitig
    eingesetzt. Diese Platzhalter nicht entfernen, wenn die Datei als Go-Template
    verwendet wird.
  -->
  <footer>
    <a href="{{.RepoURL}}" target="_blank" rel="noopener noreferrer">dnsmasq-leases-ui</a>
    v{{.Version}}{{if .ReleaseDate}} · <span data-i18n="released">released</span> {{.ReleaseDate}}{{end}}{{if .DnsmasqVersion}} · dnsmasq {{.DnsmasqVersion}}{{end}}
  </footer>

  <!-- Cache-Busting: Versionswert ändert die URL, wenn ein neues App-Build geladen wird. -->
  <script src="/static/translations.js?v={{.Version}}"></script>
  <script src="/static/app.js?v={{.Version}}"></script>
</body>
</html>
