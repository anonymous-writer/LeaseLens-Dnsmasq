# LeaseLens-Dnsmasq — native Linux configuration
# Example for a systemd service on a Raspberry Pi.
# Copy this file to your chosen location, for example:
#   /home/pi/leaselens-dnsmasq/config.yaml
# Then point the service at it with --config or CONFIG_FILE.

# Web server
host: "0.0.0.0"
port: "3008"

# dnsmasq input files — adjust these paths to your system.
# Common Debian/Raspberry Pi OS lease path:
leases_file: "/var/lib/misc/dnsmasq.leases"
# Optional file containing configured DHCP reservations:
hosts_file: "/var/lib/misc/dnsmasq.dhcphosts"

# Native-only: enable the "Remove IPv4 lease" action by setting your DHCP
# interface. Leave commented out to disable the action.
# The service account must have narrowly scoped passwordless sudo permission
# to run dhcp_release for this interface. See the main README.
# dhcp_interface: "eth0"

# Logging: DEBUG, INFO, WARN, or ERROR
log_level: "INFO"

# DHCP event script is configured in dnsmasq, not in this LeaseLens YAML file.
# Example dnsmasq directive:
# dhcp-script=/usr/local/sbin/dnsmasq-ntfy-dhcp-ipv4.sh
# The script then starts the LeaseLens binary with this config file.

# Optional legacy DHCP event log to import into the database.
# Leave unset if you no longer need to import an existing log file.
# dhcp_events_file: "/home/pi/leaselens-dnsmasq/dhcp-events.log"

# Optional legacy JSON file paths (mainly for importing old SQLite-era data).
# known_macs_file: "/home/pi/leaselens-dnsmasq/known-macs.json"
# ui_settings_file: "/home/pi/leaselens-dnsmasq/ui-settings.json"

# Optional UI metadata.
# Native builds detect the hardware model and hostname automatically when possible.
# Uncomment to override the detected values:
# system_name: "Homeserver"
# app_version: "2.2.0"
# release_date: "2026-10-22"
# repo_url: "https://github.com/anonymous-writer/leaselens-dnsmasq"

# SQLite database file path (used only when database_type is "sqlite").
# Set an explicit path instead of relying on working_dir defaults.
# database_path: "/home/pi/leaselens-dnsmasq/leaselens.db"

# Database backend: sqlite (default) or postgres.
# PostgreSQL starts with a fresh LeaseLens schema; SQLite legacy JSON/log import
# is only performed when using SQLite.
database_type: "sqlite"
database_path: "/data/leaselens.db"

# PostgreSQL settings (used only when database_type is "postgres").
# The target PostgreSQL database must already exist. LeaseLens creates its tables.
# Password can be set here or via POSTGRES_PASSWORD environment variable.
# Prefer a protected config file (chmod 600) if storing a password here.
# postgres_host: "192.168.1.10"
# postgres_port: "5432"
# postgres_database: "leaselens"
# postgres_user: "leaselens"
# postgres_password: "change-me"
# postgres_sslmode: "require"

# Optional ntfy push notifications for new, unknown IPv4 DHCP clients
ntfy_enabled: false
ntfy_url: "https://ntfy.sh/dein-topic"
ntfy_token: ""
ntfy_notify_unknown_ipv4: true
ntfy_priority: "high"
ntfy_timeout_seconds: 10

# ntfy diagnostics (also requires log_level: "DEBUG" for detailed logs)
ntfy_debug: false
database_debug: false

# Maximal number of DHCP events retained in the database (oldest entries are removed)
dhcp_events_max_entries: 100
